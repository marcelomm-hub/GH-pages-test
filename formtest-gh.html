<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Web Sencillo</title>
    <style>
        /* Estilos CSS básicos para que se vea un poco mejor */
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .formulario-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: auto;
        }
        div {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Asegura que el padding no cambie el ancho total */
        }
        button {
            background-color: #5cb85c;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #4cae4c;
        }
    </style>
</head>
<body>

    <div class="formulario-container">
        <h2>Registro Básico</h2>
        
        <form action="/procesar-datos" method="POST">
            
            <div>
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre_usuario" required>
            </div>
            
            <div>
                <label for="email">Email:</label>
                <input type="email" id="email" name="correo_electronico" required>
            </div>

            <div>
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="clave" required>
            </div>
            
            <div>
                <label for="preferencia">Preferencia:</label>
                <select id="preferencia" name="preferencia_seleccionada" required>
                    <option value="" disabled selected>Seleccione una opción</option>
                    <option value="opcion1">Opción 1</option>
                    <option value="opcion2">Opción 2</option>
                    <option value="opcion3">Opción 3</option>
                </select>
            </div>
            
            <div>
                <button type="submit">Enviar Registro</button>
            </div>

        </form>
    </div>

</body>
</html>
